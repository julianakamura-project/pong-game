<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <title>Pong</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Courier New", Courier, monospace;
      background: #080b12;
      color: #f4f7fb;
      font-synthesis: none;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background:
        radial-gradient(ellipse at 50% 35%, rgba(34, 54, 78, 0.25), transparent 58%),
        #080b12;
    }

    .game {
      width: min(100%, 900px);
    }

    .topline,
    .scoreboard,
    .bottomline {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .topline {
      margin: 0 0 20px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.28em;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1px solid #70f0c0;
      border-radius: 7px;
      color: #70f0c0;
      font-size: 16px;
      letter-spacing: 0;
      box-shadow: 0 0 18px rgba(112, 240, 192, 0.12);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #96a2b4;
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #647085;
    }

    .status[data-state="playing"] .status-dot {
      background: #70f0c0;
      box-shadow: 0 0 10px rgba(112, 240, 192, 0.8);
    }

    .scoreboard {
      justify-content: center;
      gap: clamp(22px, 8vw, 76px);
      margin: 0 0 14px;
    }

    .player-score {
      min-width: 84px;
      text-align: center;
    }

    .player-name {
      margin: 0 0 3px;
      color: #8692a4;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .score {
      margin: 0;
      font-size: clamp(34px, 8vw, 52px);
      line-height: 1;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .score.left {
      color: #70f0c0;
      text-shadow: 0 0 24px rgba(112, 240, 192, 0.19);
    }

    .score.right {
      color: #ffcc78;
      text-shadow: 0 0 24px rgba(255, 204, 120, 0.16);
    }

    .score-divider {
      padding-top: 14px;
      color: #465064;
      font-size: 20px;
    }

    .court-frame {
      padding: 8px;
      border: 1px solid #222a38;
      border-radius: 14px;
      background: #0c111b;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.4), 0 0 50px rgba(75, 130, 180, 0.06);
    }

    .court {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      background: #0a0e17;
      aspect-ratio: 4 / 3;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(7, 10, 17, 0.72);
      text-align: center;
      backdrop-filter: blur(3px);
    }

    .overlay[hidden] {
      display: none;
    }

    .overlay-card {
      max-width: 340px;
    }

    .overlay-kicker {
      margin: 0 0 10px;
      color: #70f0c0;
      font-size: 10px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
    }

    .overlay h2 {
      margin: 0 0 10px;
      font-size: clamp(25px, 6vw, 38px);
      letter-spacing: 0.08em;
    }

    .overlay-copy {
      margin: 0 0 22px;
      color: #a2adbd;
      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1.6;
    }

    button {
      min-height: 44px;
      padding: 0 23px;
      border: 0;
      border-radius: 7px;
      background: #70f0c0;
      color: #07100e;
      cursor: pointer;
      font: inherit;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      transition: background 150ms ease, transform 150ms ease;
    }

    button:hover {
      background: #91f6d0;
      transform: translateY(-1px);
    }

    button:focus-visible {
      outline: 2px solid #f4f7fb;
      outline-offset: 4px;
    }

    .bottomline {
      gap: 16px;
      margin: 16px 2px 0;
      color: #8290a3;
      font-size: 10px;
      letter-spacing: 0.08em;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }

    .key {
      display: inline-block;
      min-width: 22px;
      margin-right: 5px;
      padding: 4px 5px;
      border: 1px solid #30394a;
      border-radius: 4px;
      color: #d2d9e4;
      text-align: center;
    }

    .hint {
      color: #586477;
      text-align: right;
    }

    @media (max-width: 540px) {
      body {
        padding: 22px 14px;
      }

      .topline {
        margin-bottom: 16px;
      }

      .brand {
        font-size: 12px;
      }

      .status {
        font-size: 9px;
      }

      .court-frame {
        padding: 5px;
      }

      .bottomline {
        align-items: flex-start;
        flex-direction: column;
        font-size: 9px;
      }

      .controls {
        gap: 10px;
      }

      .hint {
        text-align: left;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="game">
    <header class="topline">
      <h1 class="brand"><span class="brand-mark" aria-hidden="true">╱</span>PONG</h1>
      <div class="status" id="status" data-state="ready" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="statusText">Ready to play</span>
      </div>
    </header>

    <section class="scoreboard" aria-label="Score">
      <div class="player-score">
        <p class="player-name">Player 1</p>
        <p class="score left" id="leftScore" aria-label="Player 1 score">0</p>
      </div>
      <span class="score-divider" aria-hidden="true">:</span>
      <div class="player-score">
        <p class="player-name">Player 2</p>
        <p class="score right" id="rightScore" aria-label="Player 2 score">0</p>
      </div>
    </section>

    <div class="court-frame">
      <div class="court" id="court">
        <canvas id="gameCanvas" width="800" height="600" aria-label="Pong game court"></canvas>
        <div class="overlay" id="overlay">
          <div class="overlay-card">
            <p class="overlay-kicker">Two players · First to 5</p>
            <h2 id="overlayTitle">Ready?</h2>
            <p class="overlay-copy" id="overlayCopy">Take your side and rally. Use the keyboard or touch the court to move your paddle.</p>
            <button id="startButton" type="button">Start game</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="bottomline">
      <div class="controls" aria-label="Keyboard controls">
        <span><span class="key">W</span><span class="key">S</span> Player 1</span>
        <span><span class="key">↑</span><span class="key">↓</span> Player 2</span>
      </div>
      <span class="hint">First player to 5 points wins</span>
    </footer>
  </main>

  <script>
    (() => {
      const WIDTH = 800;
      const HEIGHT = 600;
      const WINNING_SCORE = 5;
      const PADDLE_WIDTH = 20;
      const PADDLE_HEIGHT = 100;
      const BALL_SIZE = 18;
      const INITIAL_SPEED = 300;

      const canvas = document.getElementById("gameCanvas");
      const context = canvas.getContext("2d");
      const court = document.getElementById("court");
      const overlay = document.getElementById("overlay");
      const overlayTitle = document.getElementById("overlayTitle");
      const overlayCopy = document.getElementById("overlayCopy");
      const startButton = document.getElementById("startButton");
      const status = document.getElementById("status");
      const statusText = document.getElementById("statusText");
      const leftScoreText = document.getElementById("leftScore");
      const rightScoreText = document.getElementById("rightScore");

      const state = {
        leftScore: 0,
        rightScore: 0,
        leftY: HEIGHT / 2,
        rightY: HEIGHT / 2,
        ballX: WIDTH / 2,
        ballY: HEIGHT / 2,
        ballVX: INITIAL_SPEED,
        ballVY: INITIAL_SPEED,
        speed: INITIAL_SPEED,
        running: false,
        keys: new Set(),
        lastTime: 0,
      };

      function draw() {
        context.clearRect(0, 0, WIDTH, HEIGHT);

        const background = context.createLinearGradient(0, 0, WIDTH, HEIGHT);
        background.addColorStop(0, "#0b101a");
        background.addColorStop(1, "#090d15");
        context.fillStyle = background;
        context.fillRect(0, 0, WIDTH, HEIGHT);

        context.save();
        context.setLineDash([9, 13]);
        context.strokeStyle = "rgba(139, 155, 179, 0.25)";
        context.lineWidth = 2;
        context.beginPath();
        context.moveTo(WIDTH / 2, 22);
        context.lineTo(WIDTH / 2, HEIGHT - 22);
        context.stroke();
        context.restore();

        drawPaddle(20, state.leftY, "#70f0c0");
        drawPaddle(WIDTH - 20 - PADDLE_WIDTH, state.rightY, "#ffcc78");

        context.shadowColor = "#f4f7fb";
        context.shadowBlur = 18;
        context.fillStyle = "#f4f7fb";
        context.beginPath();
        context.arc(state.ballX, state.ballY, BALL_SIZE / 2, 0, Math.PI * 2);
        context.fill();
        context.shadowBlur = 0;
      }

      function drawPaddle(x, centerY, color) {
        context.shadowColor = color;
        context.shadowBlur = 16;
        context.fillStyle = color;
        context.beginPath();
        context.roundRect(x, centerY - PADDLE_HEIGHT / 2, PADDLE_WIDTH, PADDLE_HEIGHT, 8);
        context.fill();
        context.shadowBlur = 0;
      }

      function updateScore() {
        leftScoreText.textContent = String(state.leftScore);
        rightScoreText.textContent = String(state.rightScore);
      }

      function setStatus(text, isPlaying) {
        statusText.textContent = text;
        status.dataset.state = isPlaying ? "playing" : "ready";
      }

      function serve(direction) {
        state.ballX = WIDTH / 2;
        state.ballY = HEIGHT / 2;
        state.speed = INITIAL_SPEED;
        state.ballVX = direction * state.speed;
        state.ballVY = (Math.random() < 0.5 ? -1 : 1) * state.speed;
      }

      function showOverlay(title, copy, buttonText) {
        overlayTitle.textContent = title;
        overlayCopy.textContent = copy;
        startButton.textContent = buttonText;
        overlay.hidden = false;
      }

      function startGame() {
        if (state.leftScore >= WINNING_SCORE || state.rightScore >= WINNING_SCORE) {
          state.leftScore = 0;
          state.rightScore = 0;
          state.leftY = HEIGHT / 2;
          state.rightY = HEIGHT / 2;
          updateScore();
        }
        serve(Math.random() < 0.5 ? -1 : 1);
        state.running = true;
        state.lastTime = 0;
        overlay.hidden = true;
        setStatus("In play", true);
        draw();
        requestAnimationFrame(tick);
      }

      function scorePoint(scoringSide) {
        if (scoringSide === "left") {
          state.leftScore += 1;
        } else {
          state.rightScore += 1;
        }
        updateScore();

        if (state.leftScore >= WINNING_SCORE || state.rightScore >= WINNING_SCORE) {
          const winner = state.leftScore >= WINNING_SCORE ? "Player 1" : "Player 2";
          state.running = false;
          setStatus("Match complete", false);
          showOverlay(`${winner} wins!`, "A great rally. Play again for a rematch?", "Play again");
          draw();
          return;
        }

        serve(scoringSide === "left" ? 1 : -1);
      }

      function movePaddles(delta) {
        const movement = 400 * delta;
        if (state.keys.has("w")) state.leftY -= movement;
        if (state.keys.has("s")) state.leftY += movement;
        if (state.keys.has("arrowup")) state.rightY -= movement;
        if (state.keys.has("arrowdown")) state.rightY += movement;

        state.leftY = Math.max(PADDLE_HEIGHT / 2, Math.min(HEIGHT - PADDLE_HEIGHT / 2, state.leftY));
        state.rightY = Math.max(PADDLE_HEIGHT / 2, Math.min(HEIGHT - PADDLE_HEIGHT / 2, state.rightY));
      }

      function checkPaddleCollision() {
        const leftEdge = 20;
        const rightEdge = WIDTH - 20 - PADDLE_WIDTH;
        const ballRadius = BALL_SIZE / 2;

        if (
          state.ballVX < 0 &&
          state.ballX - ballRadius <= leftEdge + PADDLE_WIDTH &&
          state.ballX > leftEdge &&
          Math.abs(state.ballY - state.leftY) < (PADDLE_HEIGHT + BALL_SIZE) / 2
        ) {
          bounceFromPaddle(state.leftY);
        } else if (
          state.ballVX > 0 &&
          state.ballX + ballRadius >= rightEdge &&
          state.ballX < rightEdge + PADDLE_WIDTH &&
          Math.abs(state.ballY - state.rightY) < (PADDLE_HEIGHT + BALL_SIZE) / 2
        ) {
          bounceFromPaddle(state.rightY);
        }
      }

      function bounceFromPaddle(paddleY) {
        const impact = (state.ballY - paddleY) / (PADDLE_HEIGHT / 2);
        state.speed *= 1.05;
        state.ballVX = Math.sign(state.ballVX) * -state.speed * Math.sqrt(1 - Math.min(impact * impact, 0.75));
        state.ballVY = state.speed * impact * 0.8;
      }

      function tick(time) {
        if (!state.running) return;

        const delta = state.lastTime === 0 ? 0 : Math.min((time - state.lastTime) / 1000, 0.033);
        state.lastTime = time;
        movePaddles(delta);

        state.ballX += state.ballVX * delta;
        state.ballY += state.ballVY * delta;

        const radius = BALL_SIZE / 2;
        if (state.ballY - radius < 20 && state.ballVY < 0) {
          state.ballY = 20 + radius;
          state.ballVY *= -1;
          state.speed *= 1.05;
          state.ballVX = Math.sign(state.ballVX) * Math.sqrt(Math.max(0, state.speed ** 2 - state.ballVY ** 2));
        } else if (state.ballY + radius > HEIGHT - 20 && state.ballVY > 0) {
          state.ballY = HEIGHT - 20 - radius;
          state.ballVY *= -1;
          state.speed *= 1.05;
          state.ballVX = Math.sign(state.ballVX) * Math.sqrt(Math.max(0, state.speed ** 2 - state.ballVY ** 2));
        }

        checkPaddleCollision();

        if (state.ballX > WIDTH - 20) {
          scorePoint("left");
        } else if (state.ballX < 20) {
          scorePoint("right");
        }

        draw();
        if (state.running) requestAnimationFrame(tick);
      }

      function movePaddleToPointer(event) {
        if (!state.running) return;
        const bounds = court.getBoundingClientRect();
        const y = ((event.clientY - bounds.top) / bounds.height) * HEIGHT;
        const x = ((event.clientX - bounds.left) / bounds.width) * WIDTH;
        const clampedY = Math.max(PADDLE_HEIGHT / 2, Math.min(HEIGHT - PADDLE_HEIGHT / 2, y));

        if (x < WIDTH / 2) {
          state.leftY = clampedY;
        } else {
          state.rightY = clampedY;
        }
      }

      window.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();
        if (["w", "s", "arrowup", "arrowdown"].includes(key)) {
          event.preventDefault();
          state.keys.add(key);
        }
        if ((key === " " || key === "enter") && !state.running && !overlay.hidden) {
          event.preventDefault();
          startGame();
        }
      });

      window.addEventListener("keyup", (event) => {
        state.keys.delete(event.key.toLowerCase());
      });

      window.addEventListener("blur", () => state.keys.clear());
      court.addEventListener("pointermove", movePaddleToPointer);
      startButton.addEventListener("click", startGame);
      updateScore();
      draw();
    })();
  </script>
</body>
</html>
